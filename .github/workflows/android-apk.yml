name: Build Android APK

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yom-time-android-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: find www/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Test reminder and weekly session scheduling
        run: node --test tests/*.test.js

      - name: Verify bundled Adhan audio
        run: |
          test -s www/sounds/adhan.mp3
          test -s www/sounds/adhan-fajr.mp3

      - name: Generate Android project
        run: npx cap add android

      - name: Render high-resolution launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            size="$2"
            target="android/app/src/main/res/mipmap-$density"
            mkdir -p "$target"
            rsvg-convert -w "$size" -h "$size" www/icons/icon.svg > "$target/ic_launcher.png"
            cp "$target/ic_launcher.png" "$target/ic_launcher_round.png"
          done
          mkdir -p android/app/src/main/res/drawable
          rsvg-convert -w 432 -h 432 www/icons/icon.svg > android/app/src/main/res/drawable/ic_launcher_foreground.png
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <resources><color name="ic_launcher_background">#1A0B2E</color></resources>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

      - name: Install Android notification resources and permissions
        run: |
          mkdir -p android/app/src/main/res/raw android/app/src/main/res/drawable
          cp www/sounds/adhan.mp3 android/app/src/main/res/raw/adhan.mp3
          cp www/sounds/adhan-fajr.mp3 android/app/src/main/res/raw/adhan_fajr.mp3
          python3 -m pip install --quiet cairosvg
          python3 - <<'PY'
          from pathlib import Path
          import cairosvg
          root = Path("android/app/src/main/res")
          source = Path("www/icons/icon.svg").read_bytes()
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for density, size in sizes.items():
              folder = root / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              for name in ("ic_launcher", "ic_launcher_round"):
                  cairosvg.svg2png(bytestring=source, write_to=str(folder / f"{name}.png"),
                                   output_width=size, output_height=size)
          foreground = root / "drawable" / "ic_launcher_foreground.png"
          cairosvg.svg2png(bytestring=source, write_to=str(foreground),
                           output_width=432, output_height=432)
          values = root / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "ic_launcher_background.xml").write_text(
              '<resources><color name="ic_launcher_background">#1A0B2E</color></resources>\n')
          adaptive = root / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          icon_xml = (
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">'
              '<background android:drawable="@color/ic_launcher_background"/>'
              '<foreground android:drawable="@drawable/ic_launcher_foreground"/>'
              '</adaptive-icon>\n')
          (adaptive / "ic_launcher.xml").write_text(icon_xml)
          (adaptive / "ic_launcher_round.xml").write_text(icon_xml)
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          xml, count = re.subn(r'<application\b([^>]*)>', lambda m:
              '<application' + re.sub(r'\s+android:(?:roundIcon|icon)="[^"]*"', '',
                  m.group(1)) +
              ' android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round">',
              xml, count=1)
          if count != 1:
              raise SystemExit("Could not set Android launcher icon in manifest")
          manifest.write_text(xml)
          PY
          cat > android/app/src/main/res/drawable/ic_stat_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M12,2a10,10 0,1 0,10 12A8,8 0,0 1,12 2z"/>
          </vector>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text()
          permission = '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          if "android.permission.SCHEDULE_EXACT_ALARM" not in manifest:
              manifest = manifest.replace("<application", permission + "\n    <application", 1)
              path.write_text(manifest)
          PY

      - name: Generate built-in cheerful alarm tones
        run: node scripts/generate-alarm-tones.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yom-time-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish shareable APK download
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Latest Android APK
          target_commitish: ${{ github.sha }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
