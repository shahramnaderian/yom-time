name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yom-time-android-build
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: find www/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Verify bundled Adhan audio
        run: |
          test -s www/sounds/adhan.mp3
          test -s www/sounds/adhan-fajr.mp3

      - name: Generate Android project
        run: npx cap add android

      - name: Install Android notification sounds
        run: |
          mkdir -p android/app/src/main/res/raw
          cp www/sounds/adhan.mp3 android/app/src/main/res/raw/adhan.mp3
          cp www/sounds/adhan-fajr.mp3 android/app/src/main/res/raw/adhan_fajr.mp3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yom-time-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
