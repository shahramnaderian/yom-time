         -55 55-145 70-220 35-110-50-155-175-105-280
         35-75 110-120 180-125 30-2 55 5 90 30z"/>

    <g transform="translate(512 560)">
      <path d="M-70 10 L0 -30 L0 95 L-70 135 Z" fill="url(#kaaba)" stroke="#0A0E14" stroke-width="5"/>
      <path d="M0 -30 L70 10 L70 135 L0 95 Z" fill="#1A222C" stroke="#0A0E14" stroke-width="5"/>
      <path d="M-70 10 L0 -30 L70 10 L0 50 Z" fill="#2E3A48"/>
      <path d="M-70 40 L0 80 L70 40 L70 55 L0 95 L-70 55 Z" fill="url(#gold)"/>
      <path d="M18 55 L18 100 L42 112 L42 67 Z" fill="#0C1016" opacity="0.85"/>
    </g>

    <g transform="translate(512 500)">
      <line x1="0" y1="0" x2="0" y2="-175" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="16" fill="url(#gold)" stroke="#FFF6D0" stroke-width="4"/>
      <circle cx="0" cy="0" r="6" fill="#6B3E0A"/>
    </g>

    <path d="M400 820 Q512 860 624 820" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <circle cx="512" cy="848" r="6" fill="#F0D078"/>
