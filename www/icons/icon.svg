<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Yom Time">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071A2E"/>
      <stop offset="55%" stop-color="#0B3D55"/>
      <stop offset="100%" stop-color="#C45A1A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="45%" stop-color="#E8B84A"/>
      <stop offset="100%" stop-color="#A66A1A"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E4A62"/>
      <stop offset="100%" stop-color="#083040"/>
    </linearGradient>
    <linearGradient id="kaaba" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A3340"/>
      <stop offset="50%" stop-color="#121820"/>
      <stop offset="100%" stop-color="#05080C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="r">
      <rect width="1024" height="1024" rx="220"/>
    </clipPath>
  </defs>

  <g clip-path="url(#r)">
    <rect width="1024" height="1024" fill="url(#sky)"/>

    <g fill="#FFF6D0" opacity="0.9">
      <circle cx="140" cy="150" r="4"/>
      <circle cx="260" cy="90" r="2.5"/>
      <circle cx="820" cy="130" r="3.5"/>
      <circle cx="900" cy="220" r="2"/>
      <circle cx="180" cy="280" r="2"/>
      <circle cx="760" cy="80" r="2"/>
    </g>

    <circle cx="512" cy="500" r="310" fill="url(#disc)" stroke="url(#gold)" stroke-width="14"/>
    <circle cx="512" cy="500" r="268" fill="none" stroke="#1A6A82" stroke-width="6" opacity="0.7"/>

    <g stroke="url(#gold)" stroke-width="10" stroke-linecap="round">
      <line x1="512" y1="210" x2="512" y2="248"/>
      <line x1="762" y1="348" x2="730" y2="372"/>
      <line x1="720" y1="650" x2="690" y2="628"/>
      <line x1="304" y1="650" x2="334" y2="628"/>
      <line x1="262" y1="348" x2="294" y2="372"/>
    </g>

    <g fill="#F0D078">
      <circle cx="512" cy="228" r="9"/>
      <circle cx="746" cy="360" r="8"/>
      <circle cx="705" cy="639" r="8"/>
      <circle cx="319" cy="639" r="8"/>
      <circle cx="278" cy="360" r="8"/>
    </g>

    <path filter="url(#glow)" fill="url(#gold)"
